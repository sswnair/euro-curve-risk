[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euro-curve-risk"
version = "0.1.0"
description = "The ECB's euro government yield curve, bond pricing off it, and interest rate risk for a bond portfolio"
readme = "README.md"
authors = [{ name = "Sanjay Nair" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
eurocurve = "eurocurve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
